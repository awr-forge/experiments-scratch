name: Run N-Panther Bot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/2 * * * *'

permissions:
  contents: write

concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Bot Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python3 main.py

      - name: Persist offset to git
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add offset.txt
          git diff --cached --quiet || git commit -m "chore: update offset [skip ci]"
          git pull --rebase origin main || true
          git push
